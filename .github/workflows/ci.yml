name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needed for schema backward-compat check vs origin/main

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff format & lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Mypy
        # Check by installed package name (each ships py.typed). Keep in sync with the Makefile.
        run: >
          uv run mypy -p sa_core -p sa_contracts -p sa_observability -p sa_connector_sdk
          -p sa_persistence -p sa_messaging -p connector_brain -p catalog -p offer -p mcp_gateway -p matching -p price_history -p api_gateway -p sync_orchestrator -p search
        if: hashFiles('libs/**/*.py', 'services/**/*.py') != ''

      - name: Conventions check
        run: uv run python tools/check_conventions.py

      - name: Event schemas check
        run: uv run python tools/check_event_schemas.py

      - name: Validate compose stack
        run: docker compose -f infra/compose.yaml config -q

      - name: OpenAPI export up to date
        run: |
          uv run python tools/export_openapi.py
          if ! git diff --exit-code -- 'services/*/openapi.json'; then
            echo "::error::openapi.json is stale — run 'make openapi' and commit the diff"
            exit 1
          fi

      - name: OpenAPI lint (spectral)
        run: |
          if compgen -G "services/*/openapi.json" > /dev/null; then
            # Cooldown for npx-resolved deps (mirrors the Dependabot cooldown policy):
            # resolve versions as of 7 days ago so a freshly published transitive dep
            # can't break CI — @asyncapi/specs 6.11.2 (2026-07-14, ESM/CJS mismatch)
            # crashed spectral within a minute of publish.
            export npm_config_before="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            npx --yes @stoplight/spectral-cli lint "services/*/openapi.json" --ruleset .spectral.yaml
          else
            echo "no exported openapi.json yet — skipping"
          fi

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Unit tests with coverage gate
        run: |
          if compgen -G "libs/*/tests" > /dev/null || compgen -G "services/*/tests" > /dev/null; then
            uv run pytest -m "not integration and not live" --cov --cov-fail-under=75
          else
            echo "no tests yet — skipping"
          fi
      - name: Integration tests (testcontainers)
        run: |
          set +e
          uv run pytest -m integration
          rc=$?
          # exit code 5 = no tests collected (no integration tests yet) — not a failure
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  curation-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/curation-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/curation-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types match the committed gateway contract
        run: |
          pnpm generate:api
          git diff --exit-code -- src/shared/api/schema.gen.ts \
            || (echo "::error::schema.gen.ts is stale — run 'pnpm generate:api' and commit"; exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm test
      - run: pnpm build
