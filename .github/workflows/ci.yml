name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for schema backward-compat check vs origin/main

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff format & lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Mypy
        # Check by installed package name (each ships py.typed). Keep in sync with the Makefile.
        run: >
          uv run mypy -p sa_core -p sa_contracts -p sa_observability -p sa_connector_sdk
          -p sa_persistence -p sa_messaging -p connector_brain -p catalog -p offer -p mcp_gateway -p matching -p price_history -p api_gateway
        if: hashFiles('libs/**/*.py', 'services/**/*.py') != ''

      - name: Conventions check
        run: uv run python tools/check_conventions.py

      - name: Event schemas check
        run: uv run python tools/check_event_schemas.py

      - name: OpenAPI export up to date
        run: |
          uv run python tools/export_openapi.py
          if ! git diff --exit-code -- 'services/*/openapi.json'; then
            echo "::error::openapi.json is stale — run 'make openapi' and commit the diff"
            exit 1
          fi

      - name: OpenAPI lint (spectral)
        run: |
          if compgen -G "services/*/openapi.json" > /dev/null; then
            npx --yes @stoplight/spectral-cli lint "services/*/openapi.json" --ruleset .spectral.yaml
          else
            echo "no exported openapi.json yet — skipping"
          fi

  tests:
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Unit tests with coverage gate
        run: |
          if compgen -G "libs/*/tests" > /dev/null || compgen -G "services/*/tests" > /dev/null; then
            uv run pytest -m "not integration and not live" --cov --cov-fail-under=75
          else
            echo "no tests yet — skipping"
          fi
      - name: Integration tests (testcontainers)
        run: |
          set +e
          uv run pytest -m integration
          rc=$?
          # exit code 5 = no tests collected (no integration tests yet) — not a failure
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi
