[project]
name = "sa-messaging"
version = "0.1.0"
description = "Broker adapters: Kafka publisher (satisfies the outbox relay's Publisher protocol)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_messaging"]
