[project]
name = "sa-observability"
version = "0.1.0"
description = "OTel + structlog bootstrap: logging with secret redaction, tracing/metrics, RFC 9457 errors, health"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24.1",
    "fastapi>=0.111",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "sa-core",
]

[tool.uv.sources]
sa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_observability"]
