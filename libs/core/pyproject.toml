[project]
name = "sa-core"
version = "0.1.0"
description = "Shared kernel: ULID ids, money, GTIN normalization, errors (RFC 9457), cursor pagination, CloudEvents/outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_core"]
