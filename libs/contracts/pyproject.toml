[project]
name = "sa-contracts"
version = "0.1.0"
description = "Typed event payload models generated from contracts/events/*.json, plus the event registry"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "sa-core",
]

[tool.uv.sources]
sa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_contracts"]
