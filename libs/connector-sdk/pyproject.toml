[project]
name = "sa-connector-sdk"
version = "0.1.0"
description = "Toolkit every supplier connector is built on: canonical DTOs, SupplierConnector protocol, rate limiter, session manager, normalizers, raw archive, test kit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "sa-core",
]

[tool.uv.sources]
sa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_connector_sdk"]
