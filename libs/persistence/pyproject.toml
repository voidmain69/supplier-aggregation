[project]
name = "sa-persistence"
version = "0.1.0"
description = "Async SQLAlchemy helpers + the transactional outbox (store + relay) every service reuses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sa-core",
]

[tool.uv.sources]
sa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_persistence"]
