[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP gateway: curated AI tools over the catalog and offer APIs for agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sa-observability",
]

[tool.uv.sources]
sa-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
