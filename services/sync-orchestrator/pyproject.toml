[project]
name = "sync-orchestrator"
version = "0.1.0"
description = "Schedules per-account supplier syncs by emitting sync.job.requested events"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "sa-core",
    "sa-contracts",
    "sa-observability",
    "sa-persistence",
    "sa-messaging",
]

[tool.uv.sources]
sa-core = { workspace = true }
sa-contracts = { workspace = true }
sa-observability = { workspace = true }
sa-persistence = { workspace = true }
sa-messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_orchestrator"]
