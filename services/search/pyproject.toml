[project]
name = "search"
version = "0.1.0"
description = "Search service: lexical (and, later, semantic) search over supplier and canonical products"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sa-core",
    "sa-contracts",
    "sa-observability",
    "sa-persistence",
    "sa-messaging",
    "alembic>=1.13",
    "pgvector>=0.3",
]

[tool.uv.sources]
sa-core = { workspace = true }
sa-contracts = { workspace = true }
sa-observability = { workspace = true }
sa-persistence = { workspace = true }
sa-messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search"]
