[project]
name = "api-gateway"
version = "0.1.0"
description = "Single authenticated ingress (auth + scopes + rate limiting) over the internal APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sa-core",
    "sa-observability",
]

[tool.uv.sources]
sa-core = { workspace = true }
sa-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
