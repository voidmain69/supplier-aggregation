# Full local dev stack: `make up` (infra + all application services).
# Data persists in infra/.data/ (gitignored).
#
# Host entrypoints once up:
#   api-gateway  http://localhost:8080   (REST ingress; needs a bearer token — see api-gateway README)
#   mcp-gateway  http://localhost:8090   (MCP tools for agents)
#   curation-ui  http://localhost:8088   (backoffice for matching curators; needs a bearer token)
#   Redpanda console http://localhost:8085 · Grafana http://localhost:3000
#
# Each service owns its own database (created by db-init) and applies its Alembic migrations
# via a one-shot `*-migrate` job before its long-running processes start.

name: supplier-aggregation

services:
  postgres:
    image: timescale/timescaledb-ha:pg16   # includes TimescaleDB + pgvector
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa_dev_only
      POSTGRES_DB: sa
    ports: ["5432:5432"]
    volumes:
      - ./.data/postgres:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes:
      - ./.data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 15
      start_period: 10s

  console:
    image: redpandadata/console:v2.6.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8085:8080"]
    depends_on: [redpanda]

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no   # cache only, no persistence
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sa
      MINIO_ROOT_PASSWORD: sa_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./.data/minio:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, loki, prometheus]

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./.data/tempo:/var/tempo

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

  # ---------------------------------------------------------------------------
  # Application services. Each owns its own database (created by db-init); the
  # image is built from the repo root (uv workspace). Migrations run as one-shot
  # `*-migrate` jobs that the long-running processes wait on.
  # ---------------------------------------------------------------------------
  db-init:
    image: timescale/timescaledb-ha:pg16
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h postgres -U sa -d sa -q; do echo "waiting for postgres..."; sleep 1; done
        for db in brain catalog offer matching pricehistory syncorch search; do
          psql "postgresql://sa:sa_dev_only@postgres:5432/sa" -tc \
            "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || psql "postgresql://sa:sa_dev_only@postgres:5432/sa" -c "CREATE DATABASE $$db";
        done

  # --- connector-brain (producer): relay drains its outbox to Kafka ----------
  connector-brain-migrate:
    build: {context: .., dockerfile: services/connector-brain/Dockerfile}
    image: sa-connector-brain:dev
    restart: "no"
    environment:
      CONNECTOR_BRAIN_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/brain
    command: ["uv", "run", "alembic", "-c", "services/connector-brain/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  connector-brain-relay:
    image: sa-connector-brain:dev
    restart: unless-stopped
    environment:
      CONNECTOR_BRAIN_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/brain
      CONNECTOR_BRAIN_KAFKA_BOOTSTRAP: redpanda:9092
      CONNECTOR_BRAIN_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "connector_brain.relay"]
    depends_on:
      connector-brain-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- catalog: API + discovered/link consumer -------------------------------
  catalog-migrate:
    build: {context: .., dockerfile: services/catalog/Dockerfile}
    image: sa-catalog:dev
    restart: "no"
    environment:
      CATALOG_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/catalog
    command: ["uv", "run", "alembic", "-c", "services/catalog/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  catalog:
    image: sa-catalog:dev
    restart: unless-stopped
    environment:
      CATALOG_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/catalog
      CATALOG_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      catalog-migrate: {condition: service_completed_successfully}

  catalog-consumer:
    image: sa-catalog:dev
    restart: unless-stopped
    environment:
      CATALOG_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/catalog
      CATALOG_KAFKA_BOOTSTRAP: redpanda:9092
      CATALOG_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "catalog.consumer"]
    depends_on:
      catalog-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- offer: API + price-changed consumer -----------------------------------
  offer-migrate:
    build: {context: .., dockerfile: services/offer/Dockerfile}
    image: sa-offer:dev
    restart: "no"
    environment:
      OFFER_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/offer
    command: ["uv", "run", "alembic", "-c", "services/offer/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  offer:
    image: sa-offer:dev
    restart: unless-stopped
    environment:
      OFFER_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/offer
      OFFER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      offer-migrate: {condition: service_completed_successfully}

  offer-consumer:
    image: sa-offer:dev
    restart: unless-stopped
    environment:
      OFFER_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/offer
      OFFER_KAFKA_BOOTSTRAP: redpanda:9092
      OFFER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "offer.consumer"]
    depends_on:
      offer-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  offer-relay:
    image: sa-offer:dev
    restart: unless-stopped
    environment:
      OFFER_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/offer
      OFFER_KAFKA_BOOTSTRAP: redpanda:9092
      OFFER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "offer.relay"]
    depends_on:
      offer-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- matching: API + discovered consumer + link-confirmed relay ------------
  matching-migrate:
    build: {context: .., dockerfile: services/matching/Dockerfile}
    image: sa-matching:dev
    restart: "no"
    environment:
      MATCHING_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/matching
    command: ["uv", "run", "alembic", "-c", "services/matching/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  matching:
    image: sa-matching:dev
    restart: unless-stopped
    environment:
      MATCHING_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/matching
      MATCHING_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      matching-migrate: {condition: service_completed_successfully}

  matching-consumer:
    image: sa-matching:dev
    restart: unless-stopped
    environment:
      MATCHING_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/matching
      MATCHING_KAFKA_BOOTSTRAP: redpanda:9092
      MATCHING_OTLP_ENDPOINT: http://otel-collector:4317
      # TEI (BAAI/bge-m3) URL for real embeddings; unset => offline HashingEmbedder.
      # e.g. EMBEDDER_URL=http://192.168.0.192:8081 (GPU node) before `make up`.
      MATCHING_EMBEDDER_URL: ${EMBEDDER_URL:-}
    command: ["uv", "run", "python", "-m", "matching.consumer"]
    depends_on:
      matching-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  matching-relay:
    image: sa-matching:dev
    restart: unless-stopped
    environment:
      MATCHING_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/matching
      MATCHING_KAFKA_BOOTSTRAP: redpanda:9092
      MATCHING_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "matching.relay"]
    depends_on:
      matching-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- price-history: API + price-changed consumer (Timescale) ---------------
  price-history-migrate:
    build: {context: .., dockerfile: services/price-history/Dockerfile}
    image: sa-price-history:dev
    restart: "no"
    environment:
      PRICE_HISTORY_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/pricehistory
    command: ["uv", "run", "alembic", "-c", "services/price-history/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  price-history:
    image: sa-price-history:dev
    restart: unless-stopped
    environment:
      PRICE_HISTORY_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/pricehistory
      PRICE_HISTORY_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      price-history-migrate: {condition: service_completed_successfully}

  price-history-consumer:
    image: sa-price-history:dev
    restart: unless-stopped
    environment:
      PRICE_HISTORY_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/pricehistory
      PRICE_HISTORY_KAFKA_BOOTSTRAP: redpanda:9092
      PRICE_HISTORY_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "price_history.consumer"]
    depends_on:
      price-history-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- sync-orchestrator: schedules syncs (the pipeline source) --------------
  sync-orchestrator-migrate:
    build: {context: .., dockerfile: services/sync-orchestrator/Dockerfile}
    image: sa-sync-orchestrator:dev
    restart: "no"
    environment:
      SYNC_ORCHESTRATOR_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/syncorch
    command: ["uv", "run", "alembic", "-c", "services/sync-orchestrator/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  sync-orchestrator-scheduler:
    image: sa-sync-orchestrator:dev
    restart: unless-stopped
    environment:
      SYNC_ORCHESTRATOR_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/syncorch
      SYNC_ORCHESTRATOR_OTLP_ENDPOINT: http://otel-collector:4317
      # Configure accounts to sync as JSON, e.g.:
      # SYNC_ORCHESTRATOR_ACCOUNTS: '[{"account_id":"01J..ACCT1","supplier_code":"brain","settlement_currency":"USD","interval_seconds":3600}]'
    command: ["uv", "run", "python", "-m", "sync_orchestrator.scheduler"]
    depends_on:
      sync-orchestrator-migrate: {condition: service_completed_successfully}

  sync-orchestrator-relay:
    image: sa-sync-orchestrator:dev
    restart: unless-stopped
    environment:
      SYNC_ORCHESTRATOR_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/syncorch
      SYNC_ORCHESTRATOR_KAFKA_BOOTSTRAP: redpanda:9092
      SYNC_ORCHESTRATOR_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uv", "run", "python", "-m", "sync_orchestrator.relay"]
    depends_on:
      sync-orchestrator-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- search: API + indexing consumer ---------------------------------------
  search-migrate:
    build: {context: .., dockerfile: services/search/Dockerfile}
    image: sa-search:dev
    restart: "no"
    environment:
      SEARCH_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/search
    command: ["uv", "run", "alembic", "-c", "services/search/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  search:
    image: sa-search:dev
    restart: unless-stopped
    environment:
      SEARCH_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/search
      SEARCH_OTLP_ENDPOINT: http://otel-collector:4317
      # TEI (BAAI/bge-m3) URL for real embeddings; unset => offline HashingEmbedder.
      # e.g. EMBEDDER_URL=http://192.168.0.192:8081 (GPU node) before `make up`.
      SEARCH_EMBEDDER_URL: ${EMBEDDER_URL:-}
    depends_on:
      search-migrate: {condition: service_completed_successfully}

  search-consumer:
    image: sa-search:dev
    restart: unless-stopped
    environment:
      SEARCH_DB_DSN: postgresql+asyncpg://sa:sa_dev_only@postgres:5432/search
      SEARCH_KAFKA_BOOTSTRAP: redpanda:9092
      SEARCH_OTLP_ENDPOINT: http://otel-collector:4317
      SEARCH_EMBEDDER_URL: ${EMBEDDER_URL:-}
    command: ["uv", "run", "python", "-m", "search.consumer"]
    depends_on:
      search-migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}

  # --- gateways: single ingress (REST) + MCP tools ---------------------------
  api-gateway:
    build: {context: .., dockerfile: services/api-gateway/Dockerfile}
    image: sa-api-gateway:dev
    restart: unless-stopped
    environment:
      API_GATEWAY_CATALOG_BASE_URL: http://catalog:8000
      API_GATEWAY_OFFER_BASE_URL: http://offer:8000
      API_GATEWAY_PRICE_HISTORY_BASE_URL: http://price-history:8000
      API_GATEWAY_MATCHING_BASE_URL: http://matching:8000
      API_GATEWAY_OTLP_ENDPOINT: http://otel-collector:4317
      # Browser origins allowed to call the gateway (curation-ui: static host + Vite dev server).
      API_GATEWAY_CORS_ALLOW_ORIGINS: '["http://localhost:8088","http://localhost:5173"]'
      # Add principals as JSON (token SHA-256 hash -> {subject, scopes}):
      # API_GATEWAY_PRINCIPALS: '{"<sha256>": {"subject": "agent:demo", "scopes": ["catalog:read"]}}'
    ports: ["8080:8000"]
    depends_on: [catalog, offer, price-history, matching]

  mcp-gateway:
    build: {context: .., dockerfile: services/mcp-gateway/Dockerfile}
    image: sa-mcp-gateway:dev
    restart: unless-stopped
    environment:
      MCP_GATEWAY_CATALOG_BASE_URL: http://catalog:8000
      MCP_GATEWAY_OFFER_BASE_URL: http://offer:8000
      MCP_GATEWAY_PRICE_HISTORY_BASE_URL: http://price-history:8000
      MCP_GATEWAY_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8090:8000"]
    depends_on: [catalog, offer, price-history]

  # --- backoffice: curation UI (static SPA over the gateway) ------------------
  curation-ui:
    build:
      context: ..
      dockerfile: apps/curation-ui/Dockerfile
      args:
        # Baked into the bundle: the browser calls the host-published gateway port.
        VITE_API_BASE_URL: http://localhost:8080
    image: sa-curation-ui:dev
    restart: unless-stopped
    ports: ["8088:80"]
    depends_on: [api-gateway]
