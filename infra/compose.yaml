# Full local dev stack: `make up`
# Data persists in infra/.data/ (gitignored).

name: supplier-aggregation

services:
  postgres:
    image: timescale/timescaledb-ha:pg16   # includes TimescaleDB + pgvector
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa_dev_only
      POSTGRES_DB: sa
    ports: ["5432:5432"]
    volumes:
      - ./.data/postgres:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes:
      - ./.data/redpanda:/var/lib/redpanda/data

  console:
    image: redpandadata/console:v2.6.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8085:8080"]
    depends_on: [redpanda]

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no   # cache only, no persistence
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sa
      MINIO_ROOT_PASSWORD: sa_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./.data/minio:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, loki, prometheus]

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ./.data/tempo:/var/tempo

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
